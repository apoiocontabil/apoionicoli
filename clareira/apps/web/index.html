<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <meta name="color-scheme" content="light dark" />
    <title>Clareira — seu treino, no seu tempo</title>
    <meta
      name="description"
      content="Aulas conduzidas por professores reais, no tempo que você tiver. Uma experiência de treino em casa."

    <!-- A mídia da abertura começa a carregar junto com o HTML: o vídeo

    <style>
      /* Fundo idêntico ao token --papel, para não haver um lampejo branco frio

      html { background: #f6f2ea; }
      @media (prefers-color-scheme: dark) { html { background: #14120f; } }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>
      <div style="padding: 32px; font: 16px/1.6 system-ui; max-width: 60ch; margin: 0 auto">

        <p>
          Esta experiência precisa de JavaScript para reproduzir as aulas e
          guardar o seu progresso com segurança.
        </p>
        <p>
          Se você não puder ativá-lo, escreva para o suporte e organizamos outra
          forma de acesso.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
